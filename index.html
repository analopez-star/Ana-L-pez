<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Conjugo — Práctica de verbos franceses</title>
  <meta name="description" content="Aplicación educativa para practicar la conjugación y pronunciación de verbos en francés con seguimiento de rachas, estadísticas, niveles y modo sin conexión." />
  <style>
    :root {
      --bg: #F8FAFC;
      --surface: #FFFFFF;
      --surface-muted: #F1F5F9;
      --border: #E2E8F0;
      --border-strong: #CBD5E1;
      --text: #0F172A;
      --text-muted: #64748B;
      --accent: #1D4ED8;
      --accent-hover: #1E40AF;
      --accent-soft: #EFF6FF;
      --emerald: #059669;
      --emerald-bg: #ECFDF5;
      --emerald-border: #A7F3D0;
      --amber: #D97706;
      --amber-bg: #FFFBEB;
      --amber-border: #FDE68A;
      --rose: #E11D48;
      --rose-bg: #FFF1F2;
      --rose-border: #FECDD3;
      --radius: 12px;
      --radius-sm: 8px;
      --font-sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: var(--font-sans);
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    h1, h2, h3, h4, p { margin: 0; }

    button, input, select {
      font-family: inherit;
      font-size: inherit;
    }

    .tabular { font-variant-numeric: tabular-nums; }

    /* Header */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 30;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
    }

    .topbar-inner {
      max-width: 1152px;
      margin: 0 auto;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 32px;
    }

    .brand {
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--text);
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 28px;
    }

    .nav-btn {
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      padding: 6px 2px;
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--text-muted);
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      transition: color 0.15s, border-color 0.15s;
    }

    .nav-btn:hover { color: var(--text); }
    .nav-btn.active {
      color: var(--text);
      font-weight: 600;
      border-bottom-color: var(--accent);
    }

    .mobile-nav {
      display: none;
      border-top: 1px solid var(--surface-muted);
      padding: 0 8px;
    }

    @media (max-width: 760px) {
      .nav-links { display: none; }
      .mobile-nav { display: flex; }
      .mobile-nav .nav-btn {
        flex: 1;
        text-align: center;
        padding: 10px 6px;
        font-size: 0.8rem;
      }
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 40px;
      padding: 8px 18px;
      border-radius: var(--radius-sm);
      font-size: 0.875rem;
      font-weight: 600;
      border: 1px solid transparent;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      transition: background-color 0.15s, border-color 0.15s, color 0.15s;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-primary {
      background: var(--accent);
      color: #FFFFFF;
    }
    .btn-primary:hover:not(:disabled) { background: var(--accent-hover); }

    .btn-dark {
      background: var(--text);
      color: #FFFFFF;
    }
    .btn-dark:hover:not(:disabled) { background: #1E293B; }

    .btn-outline {
      background: var(--surface);
      border-color: var(--border-strong);
      color: var(--text);
    }
    .btn-outline:hover:not(:disabled) { background: var(--bg); }

    .btn-sm {
      min-height: 34px;
      padding: 6px 12px;
      font-size: 0.78rem;
    }

    .btn-danger {
      background: var(--rose);
      color: #FFFFFF;
    }
    .btn-danger:hover { background: #BE123C; }

    /* Layout */
    .container {
      max-width: 1152px;
      margin: 0 auto;
      padding: 28px 20px 64px;
    }

    .grid-practice {
      display: grid;
      grid-template-columns: minmax(0, 1.8fr) minmax(280px, 1fr);
      gap: 28px;
      align-items: start;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 24px;
    }

    .grid-4 {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 16px;
    }

    @media (max-width: 960px) {
      .grid-practice, .grid-2 { grid-template-columns: 1fr; }
      .grid-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
    }

    .section-head {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 24px;
    }

    .section-title {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .muted { color: var(--text-muted); }
    .small { font-size: 0.82rem; }
    .xs { font-size: 0.75rem; }

    /* Practice Stage */
    .stage-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .timer-display {
      font-family: var(--font-mono);
      font-size: 0.9rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .timer-urgent { color: var(--rose); }

    .progress-track {
      height: 6px;
      width: 100%;
      background: var(--surface-muted);
      border-radius: 999px;
      overflow: hidden;
      margin-top: 10px;
    }

    .progress-fill {
      height: 100%;
      background: var(--accent);
      transition: width 0.1s linear;
    }

    .prompt-wrap {
      margin: 28px 0 22px;
    }

    .prompt-word {
      margin-top: 6px;
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 10px;
    }

    .prompt-hint {
      font-size: clamp(1.05rem, 2.2vw, 1.35rem);
      font-weight: 600;
      color: #64748B;
    }

    .prompt-main {
      font-size: clamp(2rem, 4vw, 3rem);
      font-weight: 800;
      letter-spacing: -0.025em;
      line-height: 1.15;
    }

    .answer-input {
      width: 100%;
      padding: 14px 16px;
      font-size: 1.15rem;
      font-weight: 500;
      border-radius: 10px;
      border: 1px solid var(--border-strong);
      background: var(--surface);
      color: var(--text);
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .answer-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(29, 78, 216, 0.14);
    }

    .answer-input.is-ok {
      border-color: var(--emerald);
      background: var(--emerald-bg);
    }

    .answer-input.is-bad {
      border-color: var(--rose);
      background: var(--rose-bg);
    }

    .accent-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      margin-top: 12px;
    }

    .accent-key {
      min-width: 36px;
      min-height: 36px;
      padding: 4px 10px;
      border-radius: 7px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
    }

    .accent-key:hover {
      background: var(--surface-muted);
      border-color: var(--border-strong);
    }

    .reveal-box {
      margin-top: 24px;
      padding-top: 22px;
      border-top: 1px solid var(--border);
    }

    .solution-panel {
      margin-top: 14px;
      padding: 18px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg);
    }

    .solution-french {
      font-size: 1.75rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--text);
      margin-top: 4px;
    }

    /* Right Rail */
    .rail-block {
      padding: 18px 0;
      border-bottom: 1px solid var(--border);
    }
    .rail-block:first-child { padding-top: 0; }
    .rail-block:last-child { padding-bottom: 0; border-bottom: none; }

    .mini-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 12px;
      text-align: center;
    }

    .mini-stat {
      background: var(--bg);
      border-radius: 8px;
      padding: 10px 6px;
    }

    .mini-stat-val {
      font-size: 1.15rem;
      font-weight: 700;
      margin-top: 2px;
    }

    /* Config Grid */
    .verb-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(175px, 1fr));
      gap: 10px;
      margin-top: 16px;
    }

    .tense-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 10px;
      margin-top: 10px;
    }

    .select-tile {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      padding: 12px;
      border-radius: 9px;
      border: 1px solid var(--border);
      background: var(--surface);
      text-align: left;
      cursor: pointer;
      transition: border-color 0.15s, background-color 0.15s;
    }

    .select-tile:hover { background: var(--bg); border-color: var(--border-strong); }
    .select-tile.selected {
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    .check-box {
      width: 17px;
      height: 17px;
      border-radius: 4px;
      border: 1px solid var(--border-strong);
      background: var(--surface);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 2px;
      font-size: 11px;
      font-weight: 700;
      color: #FFFFFF;
    }

    .select-tile.selected .check-box {
      background: var(--accent);
      border-color: var(--accent);
    }

    /* Chart & Tables */
    .bars-7d {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 12px;
      align-items: end;
      height: 170px;
      margin-top: 20px;
    }

    .bar-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100%;
      justify-content: flex-end;
      gap: 6px;
    }

    .bar-well {
      width: 100%;
      max-width: 38px;
      flex: 1;
      background: var(--surface-muted);
      border-radius: 8px;
      padding: 3px;
      display: flex;
      align-items: flex-end;
    }

    .bar-fill {
      width: 100%;
      border-radius: 5px;
      background: var(--accent);
      transition: height 0.25s ease;
    }

    .bar-fill.goal { background: var(--emerald); }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.88rem;
    }

    th {
      text-align: left;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-muted);
      padding: 10px 8px;
      border-bottom: 1px solid var(--border);
    }

    td {
      padding: 10px 8px;
      border-bottom: 1px solid var(--surface-muted);
    }

    .text-right { text-align: right; }

    .offline-toast {
      position: fixed;
      bottom: 16px;
      left: 16px;
      z-index: 40;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border-radius: 8px;
      background: var(--amber-bg);
      border: 1px solid var(--amber-border);
      color: #78350F;
      font-size: 0.78rem;
      font-weight: 600;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.08);
    }

    .list-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }
    .list-row:last-child { border-bottom: none; }

    .search-input {
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid var(--border-strong);
      font-size: 0.88rem;
      width: 240px;
      max-width: 100%;
    }
    .search-input:focus { outline: none; border-color: var(--accent); }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <button type="button" class="brand" id="brandBtn">Conjugo</button>
      <nav class="nav-links" aria-label="Navegación principal" id="desktopNav"></nav>
      <button type="button" class="btn btn-dark btn-sm" id="newSessionBtn">Nueva sesión</button>
    </div>
    <nav class="mobile-nav" aria-label="Navegación móvil" id="mobileNav"></nav>
  </header>

  <main class="container" id="appRoot"></main>

  <div class="offline-toast" id="offlineToast" style="display:none;"></div>

  <script>
    (function () {
      'use strict';

      // Limpia cachés/Service Workers previos si la app se abre tras una versión anterior
      if (typeof navigator !== 'undefined' && 'serviceWorker' in navigator && location.protocol.startsWith('http')) {
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          regs.forEach(function (r) { r.unregister(); });
        }).catch(function () {});
        if (typeof caches !== 'undefined') {
          caches.keys().then(function (keys) {
            keys.forEach(function (k) { caches.delete(k); });
          }).catch(function () {});
        }
      }

      // =========================================================
      // 1. DATOS DE TIEMPOS VERBALES Y VERBOS
      // =========================================================
      const TENSES = [
        { id: 'present', frKey: 'present', es: 'Presente', fr: "Présent de l'indicatif", mood: 'Indicativo', note: 'Acciones habituales o actuales.' },
        { id: 'passe_simple', frKey: 'passe_compose', es: 'Pretérito perfecto simple', fr: 'Passé composé', mood: 'Indicativo', note: 'El pretérito perfecto simple español (fui, comí) se traduce en francés estándar con el passé composé.' },
        { id: 'passe_compose', frKey: 'passe_compose', es: 'Pretérito perfecto compuesto', fr: 'Passé composé', mood: 'Indicativo', note: 'El pretérito perfecto compuesto español (he ido, he comido) también corresponde al passé composé.' },
        { id: 'imparfait', frKey: 'imparfait', es: 'Pretérito imperfecto', fr: 'Imparfait', mood: 'Indicativo', note: 'Raíz de «nous» en presente + -ais, -ais, -ait, -ions, -iez, -aient (salvo être: ét-).' },
        { id: 'plus_que_parfait', frKey: 'plus_que_parfait', es: 'Pretérito pluscuamperfecto', fr: 'Plus-que-parfait', mood: 'Indicativo', note: 'Auxiliar avoir o être en imparfait + participe passé.' },
        { id: 'futur_simple', frKey: 'futur_simple', es: 'Futuro simple', fr: 'Futur simple', mood: 'Indicativo', note: 'Infinitivo (o raíz irregular) + -ai, -as, -a, -ons, -ez, -ont.' },
        { id: 'futur_anterieur', frKey: 'futur_anterieur', es: 'Futuro compuesto', fr: 'Futur antérieur', mood: 'Indicativo', note: 'Auxiliar avoir o être en futur simple + participe passé.' },
        { id: 'conditionnel_present', frKey: 'conditionnel_present', es: 'Condicional simple', fr: 'Conditionnel présent', mood: 'Condicional', note: 'Raíz del futur simple + terminaciones del imparfait.' },
        { id: 'conditionnel_passe', frKey: 'conditionnel_passe', es: 'Condicional compuesto', fr: 'Conditionnel passé', mood: 'Condicional', note: 'Auxiliar avoir o être en conditionnel présent + participe passé.' },
        { id: 'subjonctif_present', frKey: 'subjonctif_present', es: 'Presente de subjuntivo', fr: 'Subjonctif présent', mood: 'Subjuntivo', note: 'Se usa tras deseo, duda u obligación (il faut que...). Acepta con o sin «que».' },
        { id: 'imperatif', frKey: 'imperatif', es: 'Imperativo', fr: 'Impératif présent', mood: 'Imperativo', note: 'Se escribe sin pronombre sujeto. Los verbos en -er pierden la -s final en 2.ª persona singular.' }
      ];

      const TENSE_MAP = Object.fromEntries(TENSES.map(t => [t.id, t]));
      const MOODS = ['Indicativo', 'Condicional', 'Subjuntivo', 'Imperativo'];

      const frEr = (s, f) => {
        const fs = f || s;
        return {
          present: [`${s}e`, `${s}es`, `${s}e`, `${s}ons`, `${s}ez`, `${s}ent`],
          imparfait: [`${s}ais`, `${s}ais`, `${s}ait`, `${s}ions`, `${s}iez`, `${s}aient`],
          futur_simple: [`${fs}erai`, `${fs}eras`, `${fs}era`, `${fs}erons`, `${fs}erez`, `${fs}eront`],
          conditionnel_present: [`${fs}erais`, `${fs}erais`, `${fs}erait`, `${fs}erions`, `${fs}eriez`, `${fs}eraient`],
          subjonctif_present: [`${s}e`, `${s}es`, `${s}e`, `${s}ions`, `${s}iez`, `${s}ent`],
          imperatif: [`${s}e`, `${s}ons`, `${s}ez`]
        };
      };
      const frIr2 = (s) => ({
        present: [`${s}is`, `${s}is`, `${s}it`, `${s}issons`, `${s}issez`, `${s}issent`],
        imparfait: [`${s}issais`, `${s}issais`, `${s}issait`, `${s}issions`, `${s}issiez`, `${s}issaient`],
        futur_simple: [`${s}irai`, `${s}iras`, `${s}ira`, `${s}irons`, `${s}irez`, `${s}iront`],
        conditionnel_present: [`${s}irais`, `${s}irais`, `${s}irait`, `${s}irions`, `${s}iriez`, `${s}iraient`],
        subjonctif_present: [`${s}isse`, `${s}isses`, `${s}isse`, `${s}issions`, `${s}issiez`, `${s}issent`],
        imperatif: [`${s}is`, `${s}issons`, `${s}issez`]
      });
      const frFut = (s) => [`${s}ai`, `${s}as`, `${s}a`, `${s}ons`, `${s}ez`, `${s}ont`];
      const frCond = (s) => [`${s}ais`, `${s}ais`, `${s}ait`, `${s}ions`, `${s}iez`, `${s}aient`];
      const frImp = (s) => [`${s}ais`, `${s}ais`, `${s}ait`, `${s}ions`, `${s}iez`, `${s}aient`];

      const H_PRES = ['he', 'has', 'ha', 'hemos', 'habéis', 'han'];
      const H_IMP = ['había', 'habías', 'había', 'habíamos', 'habíais', 'habían'];
      const H_FUT = ['habré', 'habrás', 'habrá', 'habremos', 'habréis', 'habrán'];
      const H_COND = ['habría', 'habrías', 'habría', 'habríamos', 'habríais', 'habrían'];
      const esC = (aux, pp) => aux.map(a => `${a} ${pp}`);

      const esAr = (s, pp) => {
        const p = pp || `${s}ado`;
        return {
          present: [`${s}o`, `${s}as`, `${s}a`, `${s}amos`, `${s}áis`, `${s}an`],
          passe_simple: [`${s}é`, `${s}aste`, `${s}ó`, `${s}amos`, `${s}asteis`, `${s}aron`],
          passe_compose: esC(H_PRES, p),
          imparfait: [`${s}aba`, `${s}abas`, `${s}aba`, `${s}ábamos`, `${s}abais`, `${s}aban`],
          plus_que_parfait: esC(H_IMP, p),
          futur_simple: [`${s}aré`, `${s}arás`, `${s}ará`, `${s}aremos`, `${s}aréis`, `${s}arán`],
          futur_anterieur: esC(H_FUT, p),
          conditionnel_present: [`${s}aría`, `${s}arías`, `${s}aría`, `${s}aríamos`, `${s}aríais`, `${s}arían`],
          conditionnel_passe: esC(H_COND, p),
          subjonctif_present: [`${s}e`, `${s}es`, `${s}e`, `${s}emos`, `${s}éis`, `${s}en`],
          imperatif: [`${s}a`, `${s}emos`, `${s}ad`]
        };
      };
      const esEr = (s, pp) => {
        const p = pp || `${s}ido`;
        return {
          present: [`${s}o`, `${s}es`, `${s}e`, `${s}emos`, `${s}éis`, `${s}en`],
          passe_simple: [`${s}í`, `${s}iste`, `${s}ió`, `${s}imos`, `${s}isteis`, `${s}ieron`],
          passe_compose: esC(H_PRES, p),
          imparfait: [`${s}ía`, `${s}ías`, `${s}ía`, `${s}íamos`, `${s}íais`, `${s}ían`],
          plus_que_parfait: esC(H_IMP, p),
          futur_simple: [`${s}eré`, `${s}erás`, `${s}erá`, `${s}eremos`, `${s}eréis`, `${s}erán`],
          futur_anterieur: esC(H_FUT, p),
          conditionnel_present: [`${s}ería`, `${s}erías`, `${s}ería`, `${s}eríamos`, `${s}eríais`, `${s}erían`],
          conditionnel_passe: esC(H_COND, p),
          subjonctif_present: [`${s}a`, `${s}as`, `${s}a`, `${s}amos`, `${s}áis`, `${s}an`],
          imperatif: [`${s}e`, `${s}amos`, `${s}ed`]
        };
      };
      const esIr = (s, pp) => {

          passe_compose: ['suis', 'es', 'est', 'sommes', 'êtes', 'sont'],
          plus_que_parfait: ['étais', 'étais', 'était', 'étions', 'étiez', 'étaient'],
          futur_anterieur: ['serai', 'seras', 'sera', 'serons', 'serez', 'seront'],
          conditionnel_passe: ['serais', 'serais', 'serait', 'serions', 'seriez', 'seraient']
        }
      };

      const VOWEL_RE = /^[aeiouyàâäéèêëîïôöùûüœæh]/i;
      const REFL_PRON = { je: 'me', tu: 'te', il: 'se', elle: 'se', on: 'se', nous: 'nous', vous: 'vous', ils: 'se', elles: 'se' };
      const combinePron = (p, v, reflexive = false) => {
        if (reflexive) {
          const rp = REFL_PRON[p] || 'se';
          const joined = ((rp === 'me' || rp === 'te' || rp === 'se') && VOWEL_RE.test(v)) ? `${rp[0]}'${v}` : `${rp} ${v}`;
          return `${p} ${joined}`;
        }
        return (p === 'je' && VOWEL_RE.test(v)) ? `j'${v}` : `${p} ${v}`;
      };
      const isValidPair = (verb, tenseId) => tenseId !== 'imperatif' || (!verb.impersonal && Boolean(verb.fr.imperatif));

      function countValidPairs(vIds, tIds) {
        let c = 0;
        for (const vId of vIds) {
          const v = VERB_MAP[vId];
          if (!v) continue;
          for (const tId of tIds) if (isValidPair(v, tId)) c++;
        }
        return c;
      }

      function buildImpersonalFr(verbId, frKey) {
        if (verbId === 'y_avoir') {
          return { present: 'il y a', passe_compose: 'il y a eu', imparfait: 'il y avait', plus_que_parfait: 'il y avait eu', futur_simple: 'il y aura', futur_anterieur: 'il y aura eu', conditionnel_present: 'il y aurait', conditionnel_passe: 'il y aurait eu', subjonctif_present: 'il y ait' }[frKey] || 'il y a';
        }
        if (verbId === 'neiger') {
          return { present: 'il neige', passe_compose: 'il a neigé', imparfait: 'il neigeait', plus_que_parfait: 'il avait neigé', futur_simple: 'il neigera', futur_anterieur: 'il aura neigé', conditionnel_present: 'il neigerait', conditionnel_passe: 'il aurait neigé', subjonctif_present: 'il neige' }[frKey] || 'il neige';
        }
        return { present: 'il faut', passe_compose: 'il a fallu', imparfait: 'il fallait', plus_que_parfait: 'il avait fallu', futur_simple: 'il faudra', futur_anterieur: 'il aura fallu', conditionnel_present: 'il faudrait', conditionnel_passe: 'il aurait fallu', subjonctif_present: 'il faille' }[frKey] || 'il faut';
      }

      function generateQuestion(vIds, tIds, prevKey) {
        const pairs = [];
        for (const vId of vIds) {
          const v = VERB_MAP[vId];
          if (!v) continue;
          for (const tId of tIds) if (isValidPair(v, tId)) pairs.push({ verb: v, tenseId: tId });
        }
        if (!pairs.length) pairs.push({ verb: VERB_MAP.aller, tenseId: 'present' });
        let candidates = pairs;
        if (pairs.length > 1 && prevKey) {
          const filtered = pairs.filter(p => `${p.verb.id}:${p.tenseId}` !== prevKey);
          if (filtered.length) candidates = filtered;
        }
        const { verb, tenseId } = candidates[Math.floor(Math.random() * candidates.length)];
        const tMeta = TENSE_MAP[tenseId];
        const frKey = tMeta.frKey;

        if (verb.impersonal) {
          const canonical = buildImpersonalFr(verb.id, frKey);
          const accepted = frKey === 'subjonctif_present' ? [canonical, `qu'${canonical}`] : [canonical];
          return {
            id: `${verb.id}-${tenseId}-${Date.now()}`,
            verbId: verb.id, inf: verb.inf, esInf: verb.esInf, tenseId, frKey,
            esPrompt: verb.es[tenseId], esHint: null, canonical, accepted,
            tip: verb.note || tMeta.note, impersonal: true
          };
        }

        if (tenseId === 'imperatif') {
          const idx = Math.floor(Math.random() * 3);
          const hints = ['tú', 'nosotros/as', 'vosotros/as'];
          const canonical = verb.fr.imperatif[idx];
          const accepted = [canonical];
          const altForm = verb.altFr && verb.altFr.imperatif ? verb.altFr.imperatif[idx] : null;
          if (altForm && !accepted.includes(altForm)) accepted.push(altForm);
          return {
            id: `${verb.id}-${tenseId}-${idx}-${Date.now()}`,
            verbId: verb.id, inf: verb.inf, esInf: verb.esInf, tenseId, frKey,
            esPrompt: verb.es.imperatif[idx], esHint: hints[idx],
            canonical, accepted,
            tip: tMeta.note, impersonal: false
          };
        }

        const pIdx = Math.floor(Math.random() * 6);
        let frPron = 'je', esPron = 'yo', fem = false, useOn = false, conjIdx = pIdx;
        if (pIdx === 1) { frPron = 'tu'; esPron = 'tú'; }
        else if (pIdx === 2) { if (Math.random() < 0.5) { frPron = 'il'; esPron = 'él'; } else { frPron = 'elle'; esPron = 'ella'; fem = true; } }
        else if (pIdx === 3) {
          useOn = Math.random() < 0.5;
          frPron = useOn ? 'on' : 'nous';
          conjIdx = useOn ? 2 : 3;
          esPron = useOn ? 'nosotros/as · usa on' : 'nosotros/as · usa nous';
        }
        else if (pIdx === 4) { frPron = 'vous'; esPron = 'vosotros'; }
        else if (pIdx === 5) { if (Math.random() < 0.5) { frPron = 'ils'; esPron = 'ellos'; } else { frPron = 'elles'; esPron = 'ellas'; fem = true; } }

        const isCompound = ['passe_compose', 'plus_que_parfait', 'futur_anterieur', 'conditionnel_passe'].includes(frKey);
        const isRefl = Boolean(verb.reflexive);
        let canonical = '';
        let accepted = [];

        if (isCompound) {
          const auxForm = AUX_FORMS[verb.aux][frKey][conjIdx];
          const pref = combinePron(frPron, auxForm, isRefl);
          const pp = verb.pp;
          if (verb.aux === 'être') {
            if (pIdx === 2) { canonical = fem ? `${pref} ${pp}e` : `${pref} ${pp}`; accepted = [canonical]; }
            else if (pIdx === 5) { canonical = fem ? `${pref} ${pp}es` : `${pref} ${pp}s`; accepted = [canonical]; }
            else if (pIdx === 0 || pIdx === 1) { canonical = `${pref} ${pp}`; accepted = [`${pref} ${pp}`, `${pref} ${pp}e`]; }
            else if (pIdx === 3) {
              canonical = `${pref} ${pp}s`;
              accepted = useOn
                ? [`${pref} ${pp}s`, `${pref} ${pp}es`, `${pref} ${pp}`, `${pref} ${pp}e`]
                : [`${pref} ${pp}s`, `${pref} ${pp}es`];
            }
            else { canonical = `${pref} ${pp}s`; accepted = [`${pref} ${pp}s`, `${pref} ${pp}es`, `${pref} ${pp}`, `${pref} ${pp}e`]; }
          } else {
            canonical = `${pref} ${pp}`;
            accepted = [canonical];
          }
        } else {
          canonical = combinePron(frPron, verb.fr[frKey][conjIdx], isRefl);
          accepted = [canonical];
          const altForm = verb.altFr && verb.altFr[frKey] ? combinePron(frPron, verb.altFr[frKey][conjIdx], isRefl) : null;
          if (altForm && !accepted.includes(altForm)) accepted.push(altForm);
          if (frKey === 'subjonctif_present') {
            accepted.slice().forEach(form => {
              const withQue = (VOWEL_RE.test(frPron) ? "qu'" : 'que ') + form;
              if (!accepted.includes(withQue)) accepted.push(withQue);
            });
          }
        }

        const ambig1st = pIdx === 0 && ['imparfait', 'plus_que_parfait', 'conditionnel_present', 'conditionnel_passe', 'subjonctif_present'].includes(tenseId);
        const esHint = (pIdx === 2 || pIdx === 3 || pIdx === 5 || ambig1st) ? esPron : null;
        const baseTip = (tenseId === 'passe_simple' || tenseId === 'passe_compose') ? tMeta.note : (verb.note || tMeta.note);
        const tip = useOn ? `«on» equivale a nosotros/as, pero se conjuga en 3.ª persona del singular. ${baseTip}` : baseTip;

        return {
          id: `${verb.id}-${tenseId}-${pIdx}-${Date.now()}`,
          verbId: verb.id, inf: verb.inf, esInf: verb.esInf, tenseId, frKey,
          esPrompt: verb.es[tenseId][pIdx], esHint, canonical, accepted,
          tip,
          impersonal: false
        };
      }

      const normFr = (s) => s.trim().toLowerCase().replace(/[’`´]/g, "'").replace(/\s*'\s*/g, "'").replace(/[¡!¿?.,;:]/g, '').replace(/\s+/g, ' ');
      const stripAcc = (s) => s.normalize('NFD').replace(/[\u0300-\u036f]/g, '');

      function evaluateAnswer(raw, q, elapsedMs, timedOut, curStreak) {
        const u = normFr(raw);
        if (!u) return { isCorrect: false, isAccentIssue: false, timedOut, userAnswer: '', canonical: q.canonical, xp: 0, elapsedMs };
        const acc = q.accepted.map(normFr);
        if (acc.includes(u)) {
          let xp = 15;
          if (elapsedMs <= 6000) xp += 5;
          if (curStreak >= 2) xp += 5;
          return { isCorrect: true, isAccentIssue: false, timedOut, userAnswer: raw.trim(), canonical: q.canonical, xp, elapsedMs };
        }
        const accentIssue = acc.some(a => stripAcc(a) === stripAcc(u));
        return { isCorrect: false, isAccentIssue: accentIssue, timedOut, userAnswer: raw.trim(), canonical: q.canonical, xp: 0, elapsedMs };
      }

      // =========================================================
      // 3. VOZ EN FRANCÉS (GEMINI TTS + RESPALDO NAVEGADOR)
      // =========================================================
      let speaking = false;
      let playToken = 0;
      let currentAudio = null;
      let currentBufferSource = null;
      let activeUtterance = null;
      let speakSafetyTimer = null;
      let audioCtx = null;
      let audioErrorMsg = '';
      let ttsEndpointUnavailable = false;
      let ttsProbeDone = false;
      const ttsBufferCache = new Map();
      const ttsBlobCache = new Map();

      function ensureAudioContext() {
        try {
          const Ctx = window.AudioContext || window.webkitAudioContext;
          if (!Ctx) return null;
          if (!audioCtx) audioCtx = new Ctx();
          if (audioCtx.state === 'suspended') {
            audioCtx.resume().catch(() => {});
          }
          return audioCtx;
        } catch {
          return null;
        }
      }
      document.addEventListener('pointerdown', ensureAudioContext, { passive: true });
      document.addEventListener('keydown', ensureAudioContext, { passive: true });

      function getFrenchVoice() {
        if (!('speechSynthesis' in window)) return null;
        const voices = window.speechSynthesis.getVoices();
        const normLang = (l) => String(l || '').replace('_', '-').toLowerCase();
        const preferredNames = ['thomas', 'amélie', 'amelie', 'hortense', 'denise', 'henri', 'audrey', 'aurélie', 'aurelie', 'julie', 'paul'];
        const frVoices = voices.filter(v => normLang(v.lang).startsWith('fr'));
        return frVoices.find(v => v.localService && preferredNames.some(n => v.name.toLowerCase().includes(n)))
          || frVoices.find(v => normLang(v.lang) === 'fr-fr' && v.localService)
          || frVoices.find(v => v.localService)
          || frVoices.find(v => normLang(v.lang) === 'fr-fr')
          || frVoices[0]
          || null;
      }
      if ('speechSynthesis' in window) {
        getFrenchVoice();
        window.speechSynthesis.onvoiceschanged = () => getFrenchVoice();
      }

      function updateSpeakButtons() {
        const btn = document.getElementById('speakMainBtn');
        if (btn) btn.textContent = speaking ? '🔊 Reproduciendo...' : '🔊 Escuchar';
        const testBtn = document.getElementById('testVoiceBtn');
        if (testBtn) testBtn.textContent = speaking ? '🔊 Reproduciendo...' : '🔊 Probar audio';
        const errEl = document.getElementById('audioErrorNote');
        if (errEl) {
          errEl.textContent = audioErrorMsg;
          errEl.style.display = audioErrorMsg ? 'block' : 'none';
        }
      }

      function setAudioError(msg) {
        audioErrorMsg = msg || '';
        updateSpeakButtons();
      }

      function stopSpeaking() {
        playToken += 1;
        if (speakSafetyTimer) { clearTimeout(speakSafetyTimer); speakSafetyTimer = null; }
        if (currentBufferSource) {
          try { currentBufferSource.stop(); } catch {}
          try { currentBufferSource.disconnect(); } catch {}
          currentBufferSource = null;
        }
        if (currentAudio) {
          try {
            currentAudio.pause();
            currentAudio.currentTime = 0;
          } catch {}
          currentAudio = null;
        }
        activeUtterance = null;
        if ('speechSynthesis' in window) {
          try {
            if (window.speechSynthesis.speaking || window.speechSynthesis.pending) {
              window.speechSynthesis.cancel();
            }
          } catch {}
        }
        speaking = false;
        updateSpeakButtons();
      }

      function speakWithBrowser(text, rate, token, skipVoice = false) {
        if (token !== playToken) return;
        if (!('speechSynthesis' in window)) {
          speaking = false;
          setAudioError('Tu navegador no admite síntesis de voz.');
          return;
        }
        try {
          const synth = window.speechSynthesis;
          try { synth.resume(); } catch {}

          const u = new SpeechSynthesisUtterance(text);
          activeUtterance = u;
          if (!skipVoice) {
            const v = getFrenchVoice();
            if (v) { u.voice = v; u.lang = v.lang; } else { u.lang = 'fr-FR'; }
          } else {
            u.lang = 'fr-FR';
          }
          u.rate = rate;
          u.volume = 1;

          u.onstart = () => {
            if (token !== playToken) return;
            speaking = true;
            setAudioError('');
          };
          u.onend = () => {
            if (token !== playToken) return;
            if (activeUtterance === u) activeUtterance = null;
            if (speakSafetyTimer) { clearTimeout(speakSafetyTimer); speakSafetyTimer = null; }
            speaking = false;
            updateSpeakButtons();
          };
          u.onerror = (ev) => {
            if (token !== playToken) return;
            const errCode = ev && ev.error ? String(ev.error) : '';
            if (errCode === 'interrupted' || errCode === 'canceled') {
              speaking = false;
              updateSpeakButtons();
              return;
            }
            if (!skipVoice && u.voice && errCode !== 'not-allowed') {
              speakWithBrowser(text, rate, token, true);
              return;
            }
            if (activeUtterance === u) activeUtterance = null;
            if (speakSafetyTimer) { clearTimeout(speakSafetyTimer); speakSafetyTimer = null; }
            speaking = false;
            if (errCode === 'not-allowed') {
              setAudioError('El navegador bloqueó el audio en esta vista previa o sin clic directo. Pulsa 🔊 Escuchar o abre la app en una pestaña nueva.');
            } else {
              const count = synth.getVoices ? synth.getVoices().length : 0;
              setAudioError(`No se pudo reproducir el audio (${errCode || 'error del navegador'} · voces detectadas: ${count}). Prueba abrir la app en una pestaña nueva.`);
            }
          };

          speaking = true;
          setAudioError('');
          if (speakSafetyTimer) clearTimeout(speakSafetyTimer);
          speakSafetyTimer = setTimeout(() => {
            if (token === playToken && speaking) {
              speaking = false;
              updateSpeakButtons();
            }
          }, 7000);

          synth.speak(u);
        } catch {
          if (token === playToken) {
            speaking = false;
            setAudioError('No se pudo iniciar la síntesis de voz en este navegador.');
          }
        }
      }

      function base64ToUint8(b64) {
        const bin = atob(b64);
        const bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        return bytes;
      }

      async function playAudioBuffer(buffer, rate, token, fallbackText) {
        if (token !== playToken) return false;
        const ctx = ensureAudioContext();
        if (!ctx) return false;
        try {
          if (ctx.state === 'suspended') await ctx.resume();
          const src = ctx.createBufferSource();
          src.buffer = buffer;
          src.playbackRate.value = rate;
          src.connect(ctx.destination);
          currentBufferSource = src;
          src.onended = () => {
            if (currentBufferSource === src) currentBufferSource = null;
            if (token === playToken) {
              speaking = false;
              updateSpeakButtons();
            }
          };
          speaking = true;
          setAudioError('');
          src.start(0);
          return true;
        } catch {
          if (currentBufferSource) currentBufferSource = null;
          return false;
        }
      }

      async function playBlobUrl(url, rate, token, fallbackText) {
        if (token !== playToken) return;
        try {
          const audio = new Audio(url);
          currentAudio = audio;
          audio.playbackRate = rate;
          if ('preservesPitch' in audio) audio.preservesPitch = true;
          audio.onended = () => {
            if (currentAudio === audio) currentAudio = null;
            if (token === playToken) { speaking = false; updateSpeakButtons(); }
          };
          audio.onerror = () => {
            if (currentAudio === audio) currentAudio = null;
            speakWithBrowser(fallbackText, rate, token);
          };
          speaking = true;
          setAudioError('');
          await audio.play();
        } catch {
          if (currentAudio) currentAudio = null;
          speakWithBrowser(fallbackText, rate, token);
        }
      }

      function rememberCache(key, buffer, blobUrl) {
        if (ttsBlobCache.size >= 150) {
          const firstKey = ttsBlobCache.keys().next().value;
          if (firstKey) {
            URL.revokeObjectURL(ttsBlobCache.get(firstKey));
            ttsBlobCache.delete(firstKey);
            ttsBufferCache.delete(firstKey);
          }
        }
        if (buffer) ttsBufferCache.set(key, buffer);
        if (blobUrl) ttsBlobCache.set(key, blobUrl);
      }

      async function fetchGeminiAudio(clean) {
        const ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
        const timer = ctrl ? setTimeout(() => ctrl.abort(), 8000) : null;
        try {
          const res = await fetch('/api/tts', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ text: clean }),
            signal: ctrl ? ctrl.signal : undefined
          });
          if (timer) clearTimeout(timer);
          if (!res.ok) {
            if (res.status === 403 || res.status === 404 || res.status === 503) {
              ttsEndpointUnavailable = true;
            }
            return null;
          }
          const data = await res.json();
          if (!data || !data.audioBase64) return null;
          const bytes = base64ToUint8(data.audioBase64);
          const blobUrl = URL.createObjectURL(new Blob([bytes], { type: data.mimeType || 'audio/wav' }));
          let decoded = null;
          const ctx = ensureAudioContext();
          if (ctx) {
            try {
              decoded = await ctx.decodeAudioData(bytes.buffer.slice(0));
            } catch {}
          }
          rememberCache(clean, decoded, blobUrl);
          return { decoded, blobUrl };
        } catch {
          if (timer) clearTimeout(timer);
          return null;
        }
      }

      (function probeTtsOnStart() {
        if (ttsProbeDone) return;
        ttsProbeDone = true;
        if (navigator.onLine === false || window.location.protocol === 'file:') {
          ttsEndpointUnavailable = true;
          return;
        }
        fetchGeminiAudio('bonjour').then((res) => {
          if (!res) ttsEndpointUnavailable = true;
        }).catch(() => {
          ttsEndpointUnavailable = true;
        });
      })();

      async function speakFr(text, rate = 0.95) {
        const clean = String(text || '').trim();
        if (!clean) return;
        ensureAudioContext();
        stopSpeaking();
        const token = playToken;

        const cachedBuf = ttsBufferCache.get(clean);
        if (cachedBuf && await playAudioBuffer(cachedBuf, rate, token, clean)) {
          return;
        }
        const cachedBlob = ttsBlobCache.get(clean);
        if (cachedBlob) {
          await playBlobUrl(cachedBlob, rate, token, clean);
          return;
        }

        const canTryRemote = navigator.onLine !== false && window.location.protocol !== 'file:' && !ttsEndpointUnavailable;
        if (!canTryRemote) {
          speakWithBrowser(clean, rate, token);
          return;
        }

        speaking = true;
        setAudioError('');
        const audioData = await fetchGeminiAudio(clean);
        if (token !== playToken) return;

        if (!audioData) {
          speakWithBrowser(clean, rate, token);
          return;
        }

        if (audioData.decoded && await playAudioBuffer(audioData.decoded, rate, token, clean)) {
          return;
        }
        await playBlobUrl(audioData.blobUrl, rate, token, clean);
      }

      // =========================================================
      // 4. ALMACENAMIENTO LOCAL, RACHAS Y NIVELES
      // =========================================================
      const STORAGE_KEY = 'conjugo_html_v1';
      const defaultState = () => ({
        xp: 0, currentStreak: 0, longestStreak: 0, lastDate: null, dailyGoal: 10,
        totalAttempts: 0, totalCorrect: 0, totalTimeMs: 0, bestSessionStreak: 0,
        verbStats: {}, tenseStats: {}, dailyHistory: {},
        config: {
          verbs: PRESETS[0].ids.slice(),
          tenses: ['present', 'passe_simple', 'passe_compose', 'imparfait', 'futur_simple'],
          sessionLen: 10, autoSpeak: true, accentBar: true, infHint: false, offlineFocus: false
        }
      });

      function loadState() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return defaultState();
          const p = JSON.parse(raw);
          const d = defaultState();
          return { ...d, ...p, config: { ...d.config, ...(p.config || {}) }, verbStats: p.verbStats || {}, tenseStats: p.tenseStats || {}, dailyHistory: p.dailyHistory || {} };
        } catch { return defaultState(); }
      }
      let state = loadState();
      const saveState = () => { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch {} };

      const dateKey = (d = new Date()) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
      const yesterdayKey = () => { const d = new Date(); d.setDate(d.getDate() - 1); return dateKey(d); };
      const effectiveStreak = () => (state.lastDate === dateKey() || state.lastDate === yesterdayKey()) ? state.currentStreak : 0;

      function levelInfo(xp) {
        let cur = LEVELS[0], next = LEVELS[1];
        for (let i = 0; i < LEVELS.length; i++) {
          if (xp >= LEVELS[i].min) { cur = LEVELS[i]; next = LEVELS[i + 1] || null; }
        }
        const pct = next ? Math.min(100, Math.max(0, Math.round(((xp - cur.min) / (next.min - cur.min)) * 100))) : 100;
        return { ...cur, nextMin: next ? next.min : null, pct };
      }

      // =========================================================
      // 5. ESTADO DE LA SESIÓN Y RENDERIZADO
      // =========================================================
      let activeTab = 'practicar';
      let overrideVerbs = null;
      let searchQuery = '';
      let confirmReset = false;
      let showTopSelector = false;

      let question = null;
      let userInput = '';
      let timeLeftMs = 20000;
      let isPaused = false;
      let result = null;
      let bonusGoalXp = 0;
      let sessionAttempts = [];
      let sessionXp = 0;
      let sessionStreak = 0;
      let sessionComplete = false;
      let qStartMs = Date.now();
      let timerHandle = null;

      function activeVerbs() { return (overrideVerbs && overrideVerbs.length) ? overrideVerbs : state.config.verbs; }
      function activeTenses() { return state.config.tenses; }

      function stopTimer() {
        if (timerHandle) { clearInterval(timerHandle); timerHandle = null; }
      }

      function startTimer() {
        stopTimer();
        if (result || isPaused || sessionComplete || activeTab !== 'practicar') return;
        timerHandle = setInterval(() => {
          timeLeftMs -= 100;
          if (timeLeftMs <= 0) {
            timeLeftMs = 0;
            stopTimer();
            finalize(true);
          } else {
            const el = document.getElementById('timerNum');
            const bar = document.getElementById('timerBar');
            if (el) {
              el.textContent = `${(timeLeftMs / 1000).toFixed(1)} s`;
              el.className = 'timer-display tabular' + (timeLeftMs <= 4000 ? ' timer-urgent' : '');
            }
            if (bar) {
              bar.style.width = `${(timeLeftMs / 20000) * 100}%`;
              bar.style.background = timeLeftMs <= 4000 ? 'var(--rose)' : 'var(--accent)';
            }
          }
        }, 100);
      }

      function startNewSession(focusInput = true) {
        stopTimer();
        stopSpeaking();
        question = generateQuestion(activeVerbs(), activeTenses());
        userInput = '';
        timeLeftMs = 20000;
        isPaused = false;
        result = null;
        bonusGoalXp = 0;
        sessionAttempts = [];
        sessionXp = 0;
        sessionStreak = 0;
        sessionComplete = false;
        qStartMs = Date.now();
        render();
        startTimer();
        if (focusInput) setTimeout(() => document.getElementById('answerInput')?.focus(), 30);
      }

      function finalize(timedOut) {
        if (result) return;
        stopTimer();
        const elapsed = Math.min(20000, Date.now() - qStartMs);
        const inp = document.getElementById('answerInput');
        if (inp) userInput = inp.value;
        const ev = evaluateAnswer(userInput, question, elapsed, timedOut, sessionStreak);
        sessionStreak = ev.isCorrect ? sessionStreak + 1 : 0;
        result = ev;

        const today = dateKey();
        const yest = yesterdayKey();
        const prevToday = state.dailyHistory[today] || { attempts: 0, correct: 0, xp: 0 };
        const newTodayCount = prevToday.attempts + 1;
        bonusGoalXp = (prevToday.attempts < state.dailyGoal && newTodayCount >= state.dailyGoal) ? 30 : 0;
        const totalDelta = ev.xp + bonusGoalXp;

        if (state.lastDate === today) state.currentStreak = Math.max(1, state.currentStreak);
        else if (state.lastDate === yest) state.currentStreak += 1;
        else state.currentStreak = 1;

        state.longestStreak = Math.max(state.longestStreak, state.currentStreak);
        state.lastDate = today;
        state.xp += totalDelta;
        state.totalAttempts += 1;
        state.totalCorrect += ev.isCorrect ? 1 : 0;
        state.totalTimeMs += elapsed;
        state.bestSessionStreak = Math.max(state.bestSessionStreak, sessionStreak);

        const vs = state.verbStats[question.verbId] || { attempts: 0, correct: 0 };
        state.verbStats[question.verbId] = { attempts: vs.attempts + 1, correct: vs.correct + (ev.isCorrect ? 1 : 0) };
        const ts = state.tenseStats[question.tenseId] || { attempts: 0, correct: 0 };
        state.tenseStats[question.tenseId] = { attempts: ts.attempts + 1, correct: ts.correct + (ev.isCorrect ? 1 : 0) };
        state.dailyHistory[today] = { attempts: newTodayCount, correct: prevToday.correct + (ev.isCorrect ? 1 : 0), xp: prevToday.xp + totalDelta };
        saveState();

        sessionXp += totalDelta;
        sessionAttempts.push({
          inf: question.inf, tenseId: question.tenseId, verbId: question.verbId,
          esPrompt: question.esPrompt, canonical: question.canonical,
          userAnswer: ev.userAnswer, isCorrect: ev.isCorrect
        });

        render();
        if (state.config.autoSpeak) speakFr(question.canonical, 0.95);
        setTimeout(() => document.getElementById('nextBtn')?.focus(), 30);
      }

      function nextQuestion() {
        stopSpeaking();
        const targetLen = overrideVerbs ? Math.max(6, overrideVerbs.length * 2) : state.config.sessionLen;
        if (targetLen > 0 && sessionAttempts.length >= targetLen) {
          sessionComplete = true;
          stopTimer();
          render();

        }
        question = generateQuestion(activeVerbs(), activeTenses(), `${question.verbId}:${question.tenseId}`);
        userInput = '';
        timeLeftMs = 20000;
        isPaused = false;
        result = null;
        bonusGoalXp = 0;
        qStartMs = Date.now();
        render();
        startTimer();
        setTimeout(() => document.getElementById('answerInput')?.focus(), 30);

        `;

        const buildCleanStandaloneHtml = () => {
          const clone = document.documentElement.cloneNode(true);
          clone.querySelectorAll('script[src], link[rel="manifest"], script[type="module"]').forEach(el => el.remove());
          clone.querySelector('#appRoot').innerHTML = '';
          clone.querySelector('#desktopNav').innerHTML = '';
          clone.querySelector('#mobileNav').innerHTML = '';
          clone.querySelector('#offlineToast').style.display = 'none';
          return '<!doctype html>\n' + clone.outerHTML;
        };

        document.getElementById('offStartBtn').onclick = () => { activeTab = 'practicar'; startNewSession(); };
        document.getElementById('chkOffFocus').onchange = (e) => { state.config.offlineFocus = e.target.checked; saveState(); renderOfflineBanner(); };
        document.getElementById('testVoiceBtn').onclick = () => speakFr('Bonjour, je suis prêt à pratiquer sans connexion.', 0.92);
        document.getElementById('showHtmlBtn').onclick = () => {
          const wrap = document.getElementById('htmlSourceWrap');
          const box = document.getElementById('htmlSourceBox');
          if (!wrap || !box) return;
          if (wrap.style.display === 'none') {
            box.value = buildCleanStandaloneHtml();
            wrap.style.display = 'block';
            box.focus();
            box.select();
          } else {
            wrap.style.display = 'none';
          }
        };
        document.getElementById('copyHtmlBtn').onclick = async () => {
          const htmlText = buildCleanStandaloneHtml();
          const fb = document.getElementById('copyFeedback');
          const wrap = document.getElementById('htmlSourceWrap');
          const box = document.getElementById('htmlSourceBox');
          let copied = false;
          try {
            if (navigator.clipboard && navigator.clipboard.writeText) {
              await navigator.clipboard.writeText(htmlText);
              copied = true;
            }
          } catch {}
          if (!copied) {
            try {
              const ta = document.createElement('textarea');
              ta.value = htmlText;
              ta.style.position = 'fixed';
              ta.style.opacity = '0';
              document.body.appendChild(ta);
              ta.focus();
              ta.select();
              copied = document.execCommand('copy');
              document.body.removeChild(ta);
            } catch {}
          }
          if (copied && fb) {
            fb.style.display = 'block';
          } else if (wrap && box) {
            box.value = htmlText;
            wrap.style.display = 'block';
            box.focus();
            box.select();
          }
        };
        document.getElementById('downloadHtmlBtn').onclick = () => {
          const htmlText = buildCleanStandaloneHtml();
          const blob = new Blob([htmlText], { type: 'text/html;charset=utf-8' });
          const a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = 'conjugo.html';
          a.click();
          URL.revokeObjectURL(a.href);
        };
      }

      function render() {
        renderNav();
        renderOfflineBanner();
        const root = document.getElementById('appRoot');
        if (activeTab === 'practicar') renderPractice(root);
        else if (activeTab === 'configurar') renderConfig(root);
        else if (activeTab === 'estadisticas') renderStats(root);
        else renderOffline(root);
      }

      // Inicialización
      document.getElementById('brandBtn').onclick = () => { activeTab = 'practicar'; render(); startTimer(); };
      document.getElementById('newSessionBtn').onclick = () => { overrideVerbs = null; activeTab = 'practicar'; startNewSession(); };
      window.addEventListener('online', renderOfflineBanner);
      window.addEventListener('offline', renderOfflineBanner);

      startNewSession(true);
    })();
  </script>
</body>
</html>
